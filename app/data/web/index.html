<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOG-CHESS</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #101418; color: #d8dde2; font: 16px/1.5 -apple-system, "Segoe UI", sans-serif;
  }
  .card {
    width: min(92vw, 420px); padding: 28px; border-radius: 16px;
    background: #171d23; border: 1px solid #242c34; box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .5px; }
  .sub { color: #7c8790; font-size: 13px; margin-bottom: 20px; }
  .row { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid #1f272f; font-size: 14px; }
  .row span:first-child { color: #7c8790; }
  .row span:last-child { font-variant-numeric: tabular-nums; }
  #status { color: #6ecb63; font-weight: 600; }
  button {
    margin-top: 18px; width: 100%; padding: 12px; border: 0; border-radius: 10px;
    background: #2c6e4f; color: #eafff2; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:active { background: #24593f; }
</style>
</head>
<body>
<div class="card">
  <h1>DOG-CHESS</h1>
  <div class="sub">XIAO ESP32S3 &middot; phase 0 spike</div>
  <div class="row"><span>Status</span><span id="status">connecting…</span></div>
  <div class="row"><span>SSID</span><span id="ssid">—</span></div>
  <div class="row"><span>Board IP</span><span id="ip">—</span></div>
  <div class="row"><span>Uptime</span><span id="uptime">—</span></div>
  <div class="row"><span>Free heap</span><span id="heap">—</span></div>
  <div class="row"><span>Free PSRAM</span><span id="psram">—</span></div>
  <div class="row"><span>WiFi clients</span><span id="clients">—</span></div>
  <button id="ping">ping board</button>
</div>
<script>
async function refresh() {
  try {
    const r = await fetch("/state");
    const s = await r.json();
    document.getElementById("status").textContent = "online";
    document.getElementById("ssid").textContent = s.ssid;
    document.getElementById("ip").textContent = s.ip;
    document.getElementById("uptime").textContent = s.uptime + "s";
    document.getElementById("heap").textContent = (s.heap / 1024).toFixed(0) + " KB";
    document.getElementById("psram").textContent = (s.psram / 1024).toFixed(0) + " KB";
    document.getElementById("clients").textContent = s.clients;
  } catch (e) {
    document.getElementById("status").textContent = "offline";
  }
}
document.getElementById("ping").onclick = () => {
  document.getElementById("status").textContent = "pong ✓";
  setTimeout(refresh, 800);
};
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
